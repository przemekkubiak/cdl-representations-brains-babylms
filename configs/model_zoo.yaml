# Model zoo: families with ordered training checkpoints.
#
# Each entry defines a model family and the checkpoints (HF revisions or local
# dirs) that make up its *developmental trajectory*. Consumed by
# src/language_models/babylm_integration.py::ModelZoo and the checkpoint /
# localization runners. Checkpoints are the LM analogue of child ages (ses-5/7/9).
#
# Fields per family:
#   hf_repo:        HuggingFace repo id (mutually exclusive with checkpoint_glob)
#   checkpoint_glob: local glob for checkpoint dirs (used if hf_repo absent)
#   revisions:      ordered list of {name, step, tokens?} (HF branch/tag per ckpt)
#   arch:           architecture family hint (gpt2 | gptneox) for layer discovery
#   developmental_map: optional {step: ses-*} nearest-brain-session anchoring
#   notes:          free text

families:

  # ---- Pythia suite: dense training trajectory (compute-confound robustness) ----
  # Public branches are named step0..step143000. We log-space-sample early steps
  # (where representations change fastest) and thin the tail.
  pythia-160m:
    hf_repo: EleutherAI/pythia-160m
    arch: gptneox
    revisions:
      - {name: step0,      step: 0,      tokens: 0}
      - {name: step1,      step: 1,      tokens: 2097152}
      - {name: step2,      step: 2,      tokens: 4194304}
      - {name: step4,      step: 4,      tokens: 8388608}
      - {name: step8,      step: 8,      tokens: 16777216}
      - {name: step16,     step: 16,     tokens: 33554432}
      - {name: step32,     step: 32,     tokens: 67108864}
      - {name: step64,     step: 64,     tokens: 134217728}
      - {name: step128,    step: 128,    tokens: 268435456}
      - {name: step256,    step: 256,    tokens: 536870912}
      - {name: step512,    step: 512,    tokens: 1073741824}
      - {name: step1000,   step: 1000,   tokens: 2097152000}
      - {name: step2000,   step: 2000,   tokens: 4194304000}
      - {name: step4000,   step: 4000,   tokens: 8388608000}
      - {name: step8000,   step: 8000,   tokens: 16777216000}
      - {name: step16000,  step: 16000,  tokens: 33554432000}
      - {name: step32000,  step: 32000,  tokens: 67108864000}
      - {name: step64000,  step: 64000,  tokens: 134217728000}
      - {name: step143000, step: 143000, tokens: 299892736000}
    notes: "step*tokens ~ step * 2^21 (batch 1024 x seq 2048). Use for dense trajectory."

  pythia-410m:
    hf_repo: EleutherAI/pythia-410m
    arch: gptneox
    revisions:
      - {name: step0,      step: 0}
      - {name: step8,      step: 8}
      - {name: step64,     step: 64}
      - {name: step512,    step: 512}
      - {name: step2000,   step: 2000}
      - {name: step8000,   step: 8000}
      - {name: step32000,  step: 32000}
      - {name: step143000, step: 143000}
    notes: "Larger Pythia for model-size covariate in the compute-confound analysis."

  # ---- Full-resolution Pythia: ALL 154 checkpoints (every step* branch) --------
  # Same repos as above, but resolve_checkpoints enumerates every step* branch on
  # the Hub (log-spaced {0,1,2,4,...,512} + every 1000 up to 143000). Use when you
  # want correlations at *every* checkpoint, not the sampled trajectory. Heavy:
  # ~154 checkpoint downloads/loads per family. tokens_per_step = batch(1024) x
  # seq(2048) = 2^21, so tokens = step * 2097152.
  pythia-160m-full:
    hf_repo: EleutherAI/pythia-160m
    arch: gptneox
    all_revisions: true
    tokens_per_step: 2097152
    notes: "ALL 154 Pythia checkpoints. Full-resolution alignment/localization."

  pythia-410m-full:
    hf_repo: EleutherAI/pythia-410m
    arch: gptneox
    all_revisions: true
    tokens_per_step: 2097152
    notes: "ALL 154 Pythia checkpoints (410m size covariate). Full-resolution."

  # Optional Pythia scale ladder (same 154-checkpoint schedule, all_revisions).
  # Add any of these to a run for a size-axis figure. Heavier the larger you go.
  pythia-70m-full:
    hf_repo: EleutherAI/pythia-70m
    arch: gptneox
    all_revisions: true
    tokens_per_step: 2097152
    notes: "Smallest Pythia; cheap lower anchor of the scale ladder."

  pythia-1b-full:
    hf_repo: EleutherAI/pythia-1b
    arch: gptneox
    all_revisions: true
    tokens_per_step: 2097152
    notes: "1B scale rung."

  pythia-1.4b-full:
    hf_repo: EleutherAI/pythia-1.4b
    arch: gptneox
    all_revisions: true
    tokens_per_step: 2097152
    notes: "1.4B scale rung (upper anchor for size covariate)."

  # ---- BabyLM GPT-2 data-scale series: gpt2-babylm-{3,5,7,9} --------------------
  # In-domain, child-scale (headline developmental claim) AND a *data-efficiency*
  # axis: the four repos are trained on increasing amounts of child data. Each has
  # 9 epoch checkpoints (checkpoint-01..09). Steps verified on the Hub 2026-08-18
  # (trainer_state.json global_step). 3/5/7 share one schedule; 9 differs.
  # developmental_map spreads first/mid/last epoch to ages 5/7/9 (research choice —
  # confirm before relying on C3 ordering claims).
  babylm-gpt2-3:
    hf_repo: BrainAlign/gpt2-babylm-3
    arch: gpt2
    revisions: &babylm_357_revisions
      - {name: checkpoint-01,  step: 191}
      - {name: checkpoint-02,  step: 382}
      - {name: checkpoint-03,  step: 573}
      - {name: checkpoint-04,  step: 764}
      - {name: checkpoint-05,  step: 1146}
      - {name: checkpoint-06,  step: 1337}
      - {name: checkpoint-07,  step: 1528}
      - {name: checkpoint-08,  step: 1719}
      - {name: checkpoint-09,  step: 1908}
    developmental_map: {191: ses-5, 1146: ses-7, 1908: ses-9}
    notes: "Verified on Hub. smallest data budget. 9 epoch checkpoints."

  babylm-gpt2-5:
    hf_repo: BrainAlign/gpt2-babylm-5
    arch: gpt2
    revisions: *babylm_357_revisions
    developmental_map: {191: ses-5, 1146: ses-7, 1908: ses-9}
    notes: "Verified on Hub. mid data budget. 9 epoch checkpoints."

  babylm-gpt2-7:
    hf_repo: BrainAlign/gpt2-babylm-7
    arch: gpt2
    revisions: *babylm_357_revisions
    developmental_map: {191: ses-5, 1146: ses-7, 1908: ses-9}
    notes: "Verified on Hub. larger data budget. 9 epoch checkpoints."

  # gpt2-babylm-9 (largest data budget) has its own step schedule.
  babylm-gpt2:
    # Verified against the Hub 2026-08-18: branches are checkpoint-01..09 + main.
    # step = trainer_state.json global_step at each checkpoint (9 epoch saves over
    # 3 epochs). `main` has no trainer_state (final export == checkpoint-09), so it
    # is omitted to keep the trajectory monotonic.
    hf_repo: BrainAlign/gpt2-babylm-9
    arch: gpt2
    revisions:
      - {name: checkpoint-01,  step: 598}
      - {name: checkpoint-02,  step: 897}
      - {name: checkpoint-03,  step: 1196}
      - {name: checkpoint-04,  step: 1495}
      - {name: checkpoint-05,  step: 1794}
      - {name: checkpoint-06,  step: 2093}
      - {name: checkpoint-07,  step: 2392}
      - {name: checkpoint-08,  step: 2691}
      - {name: checkpoint-09,  step: 2990}
    # Anchoring to brain sessions is a research choice — spread first/mid/last
    # epoch to ages 5/7/9. Confirm/adjust before relying on C3 ordering claims.
    developmental_map: {598: ses-5, 1794: ses-7, 2990: ses-9}
    notes: "Verified on Hub. child-scale data => dev-honest. 9 epoch checkpoints."

  babylm-gpt2-local:
    checkpoint_glob: "checkpoints/gpt2-babylm-*/checkpoint-*"
    arch: gpt2
    notes: "Use when training checkpoints live on local disk (auto-discovered, sorted)."

  # ---- pico-lm scale ladder: PicoDecoderHF, dense checkpoints + learning dynamics -
  # Verified on Hub 2026-08-18. Per-step weights live in the run branch's commit
  # history (no step* branches), so we use commit_trajectory: each "Saving HF Model
  # -- Step N" commit is a checkpoint (~126, every 1000 steps to 125000). These are
  # the pico-analyze native models. arch: pico => generic block discovery
  # (pico_decoder.layers). Loading needs trust_remote_code (already set) and a
  # transformers compatible with pico's custom modeling_*.py.
  pico-decoder-tiny:
    hf_repo: pico-lm/pico-decoder-tiny
    arch: pico
    commit_trajectory: true
    run_branch: pico-decoder-tiny-1
    notes: "pico scale ladder (smallest). dense commit-history checkpoints."
  pico-decoder-small:
    hf_repo: pico-lm/pico-decoder-small
    arch: pico
    commit_trajectory: true
    run_branch: pico-decoder-small-1
    notes: "pico 65M (12L/384). dense checkpoints + learning_dynamics."
  pico-decoder-medium:
    hf_repo: pico-lm/pico-decoder-medium
    arch: pico
    commit_trajectory: true
    run_branch: pico-decoder-medium-1
    notes: "pico scale ladder (medium)."
  pico-decoder-large:
    hf_repo: pico-lm/pico-decoder-large
    arch: pico
    commit_trajectory: true
    run_branch: pico-decoder-large-1
    notes: "pico scale ladder (largest, ~500M)."

  # ---- Beetle English monolingual: data-budget axis (matches ds003604 English) ----
  # PicoDecoderHF (14L/768). Checkpoints exposed as clean step-<N> branches
  # (log-spaced powers of 2), resolved via all_revisions. Verified on Hub.
  beetle-humanscale-eng:
    hf_repo: Beetle-HumanScale/beetle-monolingual-humanscale-eng
    arch: pico
    all_revisions: true
    notes: "Human-scale English (developmentally plausible budget). 35 step branches."
  beetle-fineweb3-eng:
    hf_repo: Beetle-FineWeb3-24B/beetle-monolingual-fineweb3-eng
    arch: pico
    all_revisions: true
    notes: "FineWeb 24B English (web-scale budget). 19 step branches."

  # ==== PARC: architecture x seed, matched data and matched steps ============
  # https://huggingface.co/collections/jmichaelov/parc-models
  #
  # Pythia 160M, Mamba 130M and RWKV 169M, each trained on OpenWebText for 4000
  # steps (context 1024, effective batch 512), SIX SEEDS EACH, 73 shared
  # checkpoints. All eighteen repos carry an identical checkpoint set, so every
  # comparison below is at matched training step.
  #
  # Two axes this suite gives us that nothing else in the zoo does:
  #
  #   ARCHITECTURE. Transformer vs state-space vs RNN-like, with data, scale and
  #   step count held fixed. This is the direct answer to the reviewer question of
  #   whether brain-LM links resemble processes that already exist in NLP
  #   architectures (recurrence, signal propagation) or something with no current
  #   equivalent -- it can be tested rather than argued.
  #
  #   SEED. Six seeds per architecture give the alignment distribution produced by
  #   initialisation ALONE. That is the correct null for our result: an alignment
  #   is only real if it exceeds the spread across seeds of the same model. For a
  #   near-zero finding this is far stronger evidence than a p-value against zero,
  #   and it is the equivalence test asked for in TODO.md section 2.
  #
  # Blocks differ by architecture (Pythia 12, Mamba 24, RWKV 12) at a common
  # width of 768, so compare layer PROFILES by relative depth, not layer index.

